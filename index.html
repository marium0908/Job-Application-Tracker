<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <!-- Dashboard -->
        <h1 class="main-title">Job Application Tracker</h1>

        <div class="dashboard">
            <div class="card">
                <p>Total</p>
                <h2 id="totalCount">8</h2>
            </div>
            <div class="card">
                <p>Interview</p>
                <h2 id="interviewCount" class="green">0</h2>
            </div>
            <div class="card">
                <p>Rejected</p>
                <h2 id="rejectedCount" class="red">0</h2>
            </div>
        </div>

        <!-- Jobs Header -->
        <div class="jobs-header">
            <h2>Available Jobs</h2>
            <p id="tabCount">8 jobs</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="changeTab(event,'all')">All</button>
            <button class="tab-btn" onclick="changeTab(event,'interview')">Interview</button>
            <button class="tab-btn" onclick="changeTab(event,'rejected')">Rejected</button>
        </div>

        <!-- Jobs Container -->
        <div id="jobContainer"></div>

        <!-- Empty State -->
        <div id="emptyMessage" class="empty hidden">
            <img src="image/jobs.png" width="80">
            <h3>No jobs available</h3>
            <p>Check back soon for new opportunities</p>
        </div>

    </div>

<script src="js/script.js"></script>
</body>
</html>
